name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Получаем исходный код репозитория.
      - name: Checkout
        uses: actions/checkout@v4
      # Устанавливаем JDK.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Запускаем тот же build,
      # который студент запускал локально.
      - name: Build and test
        run: mvn -B clean verify
      # Даже при failed test пытаемся сохранить
      # отчеты как artifact.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
